<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Movies - Enthusiast Database</title>
    <!-- Custom Popcorn Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        
        <header>
            <h1>🍿 Our Movie Database</h1>
            <p>Browse through the community watchlist.</p>
        </header>

        <!-- Movie List Section -->
        <section class="movie-list-section">
            <div id="moviesContainer" class="movies-grid">
                <p class="loading-text">Loading movies from database...</p>
            </div>
        </section>

        <!-- Navigation back to add movie -->
        <section style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
            <a href="index.html" class="submit-btn" style="display: inline-block; text-decoration: none; width: auto;">+ Add Another Movie</a>
        </section>

    </div>

    <!-- Script for fetching movies -->
    <script src="script.js"></script>

</body>
</html>
